{% extends 'kakeibo/base.html' %}
{% load humanize %}

{% block content %}
<h2 class="mb-4">
    {% if item %}特別費を編集{% else %}特別費を追加{% endif %}
</h2>

<form method="POST">
    {% csrf_token %}

    <div class="mb-3">
        <label class="form-label">日付</label>
        <input type="date" name="date" class="form-control"
               value="{{ item.date|date:'Y-m-d' }}" required>
    </div>

    <div class="mb-3">
        <label class="form-label">種類</label>

        <div class="d-flex gap-2">
            <select name="type" class="form-control" required>
                {% for t in types %}
                    <option value="{{ t.id }}"
                        {% if item and item.type.id == t.id %}selected{% endif %}>
                        {{ t.name }}
                    </option>
                {% endfor %}
            </select>

            <!-- 種類追加 -->
            <a href="{% url 'special_type_add' %}" class="btn btn-success">
                ＋
            </a>

            <!-- 種類一覧（削除可能） -->
            <a href="{% url 'special_type_list' %}" class="btn btn-outline-danger">
                🗂
            </a>
        </div>

        {% if not types %}
            <div class="form-text text-danger">
                特別費の種類が登録されていません。「＋」から種類を追加してください。
            </div>
        {% endif %}
    </div>

    <div class="mb-3">
        <label class="form-label">金額</label>
        <input type="number" name="amount" class="form-control"
               value="{{ item.amount }}" required>
    </div>

    <div class="mb-3">
        <label class="form-label">メモ</label>
        <textarea name="memo" class="form-control">{{ item.memo }}</textarea>
    </div>

    <button type="submit" class="btn btn-primary">
        {% if item %}更新{% else %}登録{% endif %}
    </button>
    <a href="{% url 'special_list' %}" class="btn btn-secondary">戻る</a>
</form>

{% endblock %}
