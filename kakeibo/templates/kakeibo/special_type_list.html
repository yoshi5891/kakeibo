{% extends 'kakeibo/base.html' %}

{% block content %}
<div class="card mb-4">
    <div class="card-body">

        <h2 class="mb-4">特別費の種類一覧</h2>

        <a href="{% url 'special_type_add' %}" class="btn btn-success mb-3">種類を追加</a>

        <table class="table table-striped table-hover">
            <thead>
                <tr>
                    <th>種類名</th>
                    <th>件数</th>
                    <th style="width: 150px;">操作</th>
                </tr>
            </thead>
            <tbody>
                {% for t in types %}
                <tr>
                    <td>{{ t.name }}</td>
                    <td>{{ t.count }} 件</td>
                    <td>
                        <a href="{% url 'special_type_edit' t.id %}" class="btn btn-sm btn-primary">編集</a>
                        <a href="{% url 'special_type_delete' t.id %}"
                            class="btn btn-sm btn-danger"
                            onclick="return confirm('この種類を削除すると、紐づく特別費（{{ t.count }}件）も一緒に削除されます。本当に削除しますか？');">
                        削除
                        </a>
                    </td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="3">種類がありません</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>

        <a href="{% url 'special_list' %}" class="btn btn-secondary mt-3">特別費一覧に戻る</a>

    </div>
</div>
{% endblock %}
